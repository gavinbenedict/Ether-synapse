name: ether_synapse
description: >
  Privacy-first, peer-to-peer file transfer — no cloud, no accounts, no compromise.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # File access
  file_picker: ^8.0.0+1

  # Permissions
  permission_handler: ^11.3.1

  # BLE scanning (central role)
  flutter_reactive_ble: ^5.5.0

  # Rust bridge (generated bindings will reference this)
  flutter_rust_bridge: ^2.3.0

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  path_provider: ^2.1.5

  # File opening / thumbnails / MIME
  open_file: ^3.3.2
  video_thumbnail: ^0.5.3
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
